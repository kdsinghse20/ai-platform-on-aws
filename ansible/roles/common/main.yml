---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Upgrade packages
  apt:
    upgrade: dist

- name: Install required packages
  apt:
    name:
      - curl
      - wget
      - git
      - unzip
      - jq
      - htop
      - vim
      - net-tools
      - python3
      - python3-pip
      - python3-venv
    state: present
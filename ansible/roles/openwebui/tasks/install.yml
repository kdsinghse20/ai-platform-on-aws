---
- name: Install required packages
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
    state: present

- name: Create OpenWebUI user
  user:
    name: "{{ openwebui_user }}"
    system: yes
    create_home: no

- name: Create installation directory
  file:
    path: "{{ openwebui_home }}"
    state: directory
    owner: "{{ openwebui_user }}"
    group: "{{ openwebui_user }}"
    mode: "0755"

- name: Create virtual environment
  command:
    cmd: python3 -m venv {{ openwebui_home }}/venv
    creates: "{{ openwebui_home }}/venv"

- name: Install OpenWebUI (Async Trigger)
  pip:
    name: open-webui
    virtualenv: "{{ openwebui_home }}/venv"
    state: latest
    extra_args: "-q --no-cache-dir"  # -q prevents the SSM logging overflow
  async: 1800                        # Allow up to 30 minutes
  poll: 0                            # Fire-and-forget to prevent SSM drops
  register: openwebui_install_job

- name: Wait for OpenWebUI installation to finish
  async_status:
    jid: "{{ openwebui_install_job.ansible_job_id }}"
  register: job_result
  until: job_result.finished
  retries: 60                        # 60 retries * 15 seconds = 15 minutes max wait
  delay: 15                          # Checks the status safely every 15 seconds